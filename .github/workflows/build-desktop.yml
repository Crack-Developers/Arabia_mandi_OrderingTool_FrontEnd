name: Build & Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
          - os: ubuntu-latest
            platform: Linux

    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.platform }}

    steps:
      # ── 1. Checkout repo (contains both src/ and electron/) ──────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Build React frontend ───────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      # ── 4. Install Electron dependencies (skips node_modules from gitignore) ──
      - name: Install Electron dependencies
        run: npm install
        working-directory: electron

      # ── 5. Rebuild better-sqlite3 for Electron's Node ABI ────────────────────
      - name: Rebuild native modules
        run: npx @electron/rebuild -f -w better-sqlite3
        working-directory: electron

      # ── 6. Build platform-specific installer ─────────────────────────────────
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS installer
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux installers
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Upload artifacts ───────────────────────────────────────────────────
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: petpooja-pos-${{ matrix.platform }}
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.zip
            electron/dist-electron/*.AppImage
            electron/dist-electron/*.deb
          if-no-files-found: warn
          retention-days: 30

  # ── Publish all installers to GitHub Releases ────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Petpooja POS ${{ github.ref_name }}"
          body: |
            ## 🚀 Petpooja POS Desktop — ${{ github.ref_name }}

            Download the installer for your operating system:

            | OS | File | How to install |
            |----|------|----------------|
            | 🪟 **Windows** | `PetpoojaPOS Setup *.exe` | Double-click → Next → Done |
            | 🪟 **Windows** | `PetpoojaPOS *.exe` *(Portable)* | Run directly — no install |
            | 🍎 **macOS** | `PetpoojaPOS-*-mac.zip` | Extract → double-click app |
            | 🐧 **Linux** | `PetpoojaPOS-*.AppImage` | Double-click to run |
            | 🐧 **Linux** | `petpooja-pos_*.deb` | `sudo dpkg -i <file>` |

            ### First-Time Setup
            1. Install and open the app
            2. Connect to internet → log in with branch credentials
            3. App downloads branch data → **works fully offline** from then on

            ### Branch IT Setup
            - Assign the desktop machine a **static LAN IP** (e.g. `192.168.1.10`)
            - Mobile waiter app → enter this IP during setup
          files: installers/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
